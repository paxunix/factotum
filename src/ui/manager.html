<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="../vendor/webawesome/styles/themes/default.css" />
    <link rel="stylesheet" href="page.css" />
    <link rel="stylesheet" href="manager.css" />
  </head>
  <body>
    <main class="manager-shell">
      <header class="manager-topbar">
        <div class="hero">
          <h1 id="manager-title"></h1>
          <p class="hint" id="manager-hint"></p>
        </div>
        <nav class="nav">
          <wa-button variant="brand" href="manager.html" id="nav-manager"></wa-button>
          <wa-button variant="neutral" href="log.html" id="nav-logs"></wa-button>
        </nav>
      </header>

      <section class="manager-grid">
        <aside class="manager-pane command-list-section" aria-labelledby="command-list-title">
          <div class="section-heading">
            <h2 id="command-list-title"></h2>
            <p class="hint" id="command-list-hint"></p>
          </div>
          <wa-input id="command-filter" size="small" clearable></wa-input>
          <div class="empty-state" id="command-list-empty" hidden></div>
          <wa-tab-group placement="start" class="command-list command-tabs" id="command-list"></wa-tab-group>
        </aside>

        <aside class="manager-pane import-export-section" aria-labelledby="bundle-tools-title">
          <div class="section-heading">
            <h2 id="bundle-tools-title"></h2>
            <p class="hint" id="bundle-tools-hint"></p>
          </div>
          <div class="bundle-actions">
            <wa-button variant="brand" id="import-bundle-button"></wa-button>
            <wa-button variant="neutral" id="export-bundle-button"></wa-button>
          </div>
          <wa-textarea id="bundle-textarea" class="bundle-textarea" resize="vertical" spellcheck="false"></wa-textarea>
          <div class="bundle-status" id="bundle-status" hidden></div>
        </aside>

        <section class="manager-pane command-editor-section" aria-labelledby="command-editor-title">
          <div class="section-heading">
            <h2 id="command-editor-title"></h2>
            <p class="hint" id="command-editor-hint"></p>
          </div>
          <div class="empty-state" id="command-editor-empty"></div>
          <form class="command-editor" id="command-editor" hidden>
            <div class="editor-grid">
              <wa-input id="editor-name" readonly></wa-input>
              <wa-input id="editor-id" readonly></wa-input>
              <wa-input id="editor-world" readonly></wa-input>
              <wa-switch id="editor-disabled"></wa-switch>
            </div>
            <div class="editor-actions">
              <wa-button variant="brand" type="submit" id="editor-save-button"></wa-button>
              <wa-button variant="neutral" type="button" id="editor-reset-button"></wa-button>
            </div>
            <wa-textarea id="editor-description" class="editor-textarea-small" resize="auto" spellcheck="false"></wa-textarea>
            <details class="editor-advanced">
              <summary id="editor-advanced-label"></summary>
              <wa-textarea id="editor-help-template" class="editor-textarea-small" resize="auto" spellcheck="false"></wa-textarea>
              <wa-textarea id="editor-help-strings" class="editor-textarea-small" resize="auto" spellcheck="false"></wa-textarea>
              <wa-textarea id="editor-options" class="editor-textarea-small" resize="auto" spellcheck="false"></wa-textarea>
              <wa-textarea id="editor-requires" class="editor-textarea-small" resize="auto" spellcheck="false"></wa-textarea>
            </details>
            <wa-textarea id="editor-code" class="editor-code" resize="auto" spellcheck="false"></wa-textarea>
            <div class="bundle-status" id="editor-status" hidden></div>
          </form>
        </section>
      </section>
    </main>
    <script src="manager.js"></script>
  </body>
</html>
