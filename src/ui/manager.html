<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="../vendor/webawesome/styles/themes/default.css" />
    <link rel="stylesheet" href="page.css" />
    <link rel="stylesheet" href="manager.css" />
  </head>
  <body>
    <main class="manager-shell">
      <header class="manager-topbar">
        <div class="hero">
          <h1 id="manager-title"></h1>
          <p class="hint" id="manager-hint"></p>
        </div>
      </header>

      <wa-tab-group class="manager-tabs" id="manager-tabs">
        <wa-tab slot="nav" panel="manager-panel" id="manager-tab-manager"></wa-tab>
        <wa-tab slot="nav" panel="utilities-panel" id="manager-tab-utilities"></wa-tab>

        <wa-tab-panel name="manager-panel">
          <section class="manager-grid manager-grid-main">
            <aside class="manager-pane command-list-section" aria-labelledby="command-list-title">
              <div class="section-heading">
                <h2 id="command-list-title"></h2>
                <p class="hint" id="command-list-hint"></p>
              </div>
              <div class="command-list-controls">
                <wa-input id="command-filter" size="small" clearable></wa-input>
                <wa-select id="command-sort" size="small"></wa-select>
                <wa-button id="command-sort-direction" class="icon-button" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                <wa-button id="command-new-button" variant="brand" appearance="filled-outlined" size="small" type="button"></wa-button>
              </div>
              <div class="empty-state" id="command-list-empty" hidden></div>
              <div class="command-list-body" id="command-list-body">
                <wa-tab-group placement="start" class="command-list command-tabs" id="command-list"></wa-tab-group>
                <div class="command-selected-card" id="command-selected-card" hidden></div>
              </div>
            </aside>

            <section class="manager-pane command-editor-section" aria-labelledby="command-editor-title">
              <div class="section-heading">
                <h2 id="command-editor-title"></h2>
                <p class="hint" id="command-editor-hint"></p>
              </div>
              <div class="empty-state" id="command-editor-empty"></div>
              <form class="command-editor" id="command-editor" hidden>
                <div class="editor-actions">
                  <wa-button variant="brand" appearance="filled-outlined" type="submit" id="editor-save-button"></wa-button>
                  <wa-button variant="neutral" appearance="filled-outlined" type="button" id="editor-reset-button"></wa-button>
                </div>
                <div class="bundle-status" id="editor-status" hidden></div>
                <wa-tab-group placement="start" class="editor-section-tabs" id="editor-section-tabs" active="editor-section-identity">
                  <wa-tab slot="nav" panel="editor-section-identity" id="editor-section-identity-tab" active></wa-tab>
                  <wa-tab slot="nav" panel="editor-section-description" id="editor-section-description-tab"></wa-tab>
                  <wa-tab slot="nav" panel="editor-section-help" id="editor-section-help-tab"></wa-tab>
                  <wa-tab slot="nav" panel="editor-section-options" id="editor-section-options-tab"></wa-tab>
                  <wa-tab slot="nav" panel="editor-section-requires" id="editor-section-requires-tab"></wa-tab>
                  <wa-tab slot="nav" panel="editor-section-code" id="editor-section-code-tab"></wa-tab>
                  <wa-tab slot="nav" panel="editor-section-export" id="editor-section-export-tab"></wa-tab>

                  <wa-tab-panel name="editor-section-identity" active>
                    <section class="editor-section-panel">
                      <div class="editor-grid">
                        <wa-input id="editor-name"></wa-input>
                        <wa-input id="editor-id"></wa-input>
                        <wa-input id="editor-version"></wa-input>
                        <wa-input id="editor-aliases"></wa-input>
                      </div>
                      <div class="editor-identity-toggle">
                        <wa-switch id="editor-show-overlay" size="small"></wa-switch>
                      </div>
                    </section>
                  </wa-tab-panel>
                  <wa-tab-panel name="editor-section-description">
                    <section class="editor-section-panel">
                      <div class="localized-editor">
                        <div class="localized-editor-header">
                          <div id="editor-description-label" class="editor-field-label"></div>
                          <wa-button id="editor-description-add" class="icon-button localized-editor-add" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                        </div>
                        <div class="localized-editor-rows" id="editor-description-rows"></div>
                      </div>
                    </section>
                  </wa-tab-panel>
                  <wa-tab-panel name="editor-section-help">
                    <section class="editor-section-panel">
                      <wa-tab-group class="help-mode-tabs" id="editor-help-mode-tabs" active="editor-help-mode-edit">
                        <wa-tab slot="nav" panel="editor-help-mode-edit" id="editor-help-mode-edit-tab" active></wa-tab>
                        <wa-tab slot="nav" panel="editor-help-mode-preview" id="editor-help-mode-preview-tab"></wa-tab>

                        <wa-tab-panel name="editor-help-mode-edit" active>
                          <section class="help-mode-panel help-mode-edit-panel">
                            <div id="editor-help-template-label" class="editor-field-label"></div>
                            <div class="editor-toolstrip">
                              <wa-button id="editor-help-template-format-js" class="editor-tool-button" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                              <wa-button id="editor-help-template-format-html" class="editor-tool-button" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                              <wa-button id="editor-help-template-format-css" class="editor-tool-button" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                            </div>
                            <div id="editor-help-template" class="editor-codemirror editor-help-template" role="textbox" aria-labelledby="editor-help-template-label"></div>
                            <div class="help-strings-editor">
                              <div class="help-strings-editor-header">
                                <div id="editor-help-strings-label" class="editor-field-label"></div>
                                <wa-button id="editor-help-strings-add-locale" class="icon-button help-strings-editor-add" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                              </div>
                              <div class="help-strings-editor-blocks" id="editor-help-strings-blocks"></div>
                            </div>
                          </section>
                        </wa-tab-panel>

                        <wa-tab-panel name="editor-help-mode-preview">
                          <section class="help-mode-panel help-mode-preview-panel">
                            <div class="help-preview-toolbar">
                              <wa-select id="editor-help-preview-locale" size="small"></wa-select>
                            </div>
                            <div class="bundle-status" id="editor-help-preview-status" hidden></div>
                            <div class="help-preview-shell" id="editor-help-preview-shell">
                              <div class="help-preview-host" id="editor-help-preview-host"></div>
                            </div>
                          </section>
                        </wa-tab-panel>
                      </wa-tab-group>
                    </section>
                  </wa-tab-panel>
                  <wa-tab-panel name="editor-section-options">
                    <section class="editor-section-panel">
                      <div class="options-editor">
                        <div class="options-editor-top-grid">
                          <wa-input id="editor-options-args"></wa-input>
                        </div>
                        <div class="options-editor-header">
                          <div id="editor-options-label" class="editor-field-label"></div>
                          <wa-button id="editor-options-add" class="icon-button options-editor-add" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                        </div>
                        <div class="options-editor-rows" id="editor-options-rows"></div>
                      </div>
                    </section>
                  </wa-tab-panel>
                  <wa-tab-panel name="editor-section-requires">
                    <section class="editor-section-panel">
                      <div class="requires-editor">
                        <div class="requires-editor-header">
                          <div id="editor-requires-label" class="editor-field-label"></div>
                          <wa-button id="editor-requires-add" class="icon-button requires-editor-add" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                        </div>
                        <div class="requires-editor-rows" id="editor-requires-rows"></div>
                      </div>
                    </section>
                  </wa-tab-panel>
                  <wa-tab-panel name="editor-section-code">
                    <section class="editor-section-panel editor-code-panel">
                      <div id="editor-code-label" class="editor-field-label"></div>
                      <div class="editor-toolstrip">
                        <wa-button id="editor-code-format-js" class="editor-tool-button" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                        <wa-button id="editor-code-format-html" class="editor-tool-button" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                        <wa-button id="editor-code-format-css" class="editor-tool-button" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                      </div>
                      <div id="editor-code" class="editor-codemirror editor-code" role="textbox" aria-labelledby="editor-code-label"></div>
                    </section>
                  </wa-tab-panel>
                  <wa-tab-panel name="editor-section-export">
                    <section class="editor-section-panel editor-export-panel">
                      <wa-textarea id="editor-command-export" class="editor-textarea-large editor-textarea-fill" resize="none" readonly spellcheck="false"></wa-textarea>
                    </section>
                  </wa-tab-panel>
                </wa-tab-group>
              </form>
            </section>
          </section>
        </wa-tab-panel>

        <wa-tab-panel name="utilities-panel">
          <section class="manager-grid manager-grid-utilities">
            <aside class="manager-pane import-export-section" aria-labelledby="bundle-tools-title">
              <div class="section-heading">
                <h2 id="bundle-tools-title"></h2>
                <p class="hint" id="bundle-tools-hint"></p>
              </div>
              <div class="bundle-actions">
                <wa-button variant="brand" appearance="filled-outlined" id="import-bundle-button"></wa-button>
                <wa-button variant="neutral" appearance="filled-outlined" id="export-bundle-button"></wa-button>
              </div>
              <wa-textarea id="bundle-textarea" class="bundle-textarea" resize="none" spellcheck="false"></wa-textarea>
              <div class="bundle-status" id="bundle-status" hidden></div>
              <section class="bundle-review" id="bundle-review" hidden>
                <div class="bundle-review-header">
                  <div>
                    <h3 id="bundle-review-title"></h3>
                    <p class="hint" id="bundle-review-hint"></p>
                  </div>
                  <div class="bundle-review-actions">
                    <wa-button variant="brand" appearance="filled-outlined" id="bundle-review-import-button" size="small" type="button"></wa-button>
                    <wa-button variant="neutral" appearance="filled-outlined" id="bundle-review-cancel-button" size="small" type="button"></wa-button>
                  </div>
                </div>
                <wa-input id="bundle-review-filter" size="small" clearable></wa-input>
                <div class="bundle-review-sections">
                  <section class="bundle-review-section" id="bundle-review-commands-section">
                    <div class="bundle-review-section-header">
                      <h4 id="bundle-review-commands-title"></h4>
                      <div class="bundle-review-section-actions" id="bundle-review-commands-actions" hidden>
                        <wa-input id="bundle-review-commands-filter" size="small" clearable></wa-input>
                        <wa-select id="bundle-review-commands-sort" size="small"></wa-select>
                        <wa-button id="bundle-review-commands-sort-direction" class="icon-button" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                        <wa-button id="bundle-review-commands-select-all" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                        <wa-button id="bundle-review-commands-select-none" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                      </div>
                    </div>
                    <div class="bundle-review-list" id="bundle-review-commands"></div>
                  </section>
                  <section class="bundle-review-section" id="bundle-review-invalid-section">
                    <div class="bundle-review-section-header">
                      <h4 id="bundle-review-invalid-title"></h4>
                    </div>
                    <div class="bundle-review-list" id="bundle-review-invalid"></div>
                  </section>
                  <section class="bundle-review-section" id="bundle-review-aliases-section">
                    <div class="bundle-review-section-header">
                      <h4 id="bundle-review-aliases-title"></h4>
                      <div class="bundle-review-section-actions" id="bundle-review-aliases-actions" hidden>
                        <wa-input id="bundle-review-aliases-filter" size="small" clearable></wa-input>
                        <wa-select id="bundle-review-aliases-sort" size="small"></wa-select>
                        <wa-button id="bundle-review-aliases-sort-direction" class="icon-button" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                        <wa-button id="bundle-review-aliases-select-all" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                        <wa-button id="bundle-review-aliases-select-none" variant="neutral" appearance="filled-outlined" size="small" type="button"></wa-button>
                      </div>
                    </div>
                    <div class="bundle-review-list" id="bundle-review-aliases"></div>
                  </section>
                </div>
                <div class="bundle-review-empty" id="bundle-review-empty" hidden></div>
              </section>
            </aside>
          </section>
        </wa-tab-panel>
      </wa-tab-group>
    </main>
    <script src="manager.js"></script>
  </body>
</html>
