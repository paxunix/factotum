<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="../vendor/webawesome/styles/themes/default.css" />
    <link rel="stylesheet" href="page.css" />
    <link rel="stylesheet" href="manager.css" />
  </head>
  <body>
    <main class="page">
      <div class="hero">
        <h1 id="manager-title"></h1>
        <p class="hint" id="manager-hint"></p>
      </div>
      <nav class="nav">
        <wa-button variant="brand" href="manager.html" id="nav-manager"></wa-button>
        <wa-button variant="neutral" href="log.html" id="nav-logs"></wa-button>
      </nav>
      <section class="import-export-section" aria-labelledby="bundle-tools-title">
        <div class="section-heading">
          <h2 id="bundle-tools-title"></h2>
          <p class="hint" id="bundle-tools-hint"></p>
        </div>
        <div class="bundle-actions">
          <wa-button variant="brand" id="import-bundle-button"></wa-button>
          <wa-button variant="neutral" id="export-bundle-button"></wa-button>
        </div>
        <label class="bundle-label" for="bundle-textarea" id="bundle-label"></label>
        <textarea id="bundle-textarea" class="bundle-textarea" spellcheck="false"></textarea>
        <div class="bundle-status" id="bundle-status" hidden></div>
      </section>
      <section class="command-list-section" aria-labelledby="command-list-title">
        <div class="section-heading">
          <h2 id="command-list-title"></h2>
          <p class="hint" id="command-list-hint"></p>
        </div>
        <div class="empty-state" id="command-list-empty" hidden></div>
        <div class="command-list" id="command-list"></div>
      </section>
      <section class="command-editor-section" aria-labelledby="command-editor-title">
        <div class="section-heading">
          <h2 id="command-editor-title"></h2>
          <p class="hint" id="command-editor-hint"></p>
        </div>
        <div class="empty-state" id="command-editor-empty"></div>
        <form class="command-editor" id="command-editor" hidden>
          <div class="editor-grid">
            <label class="editor-field">
              <span id="editor-name-label"></span>
              <input id="editor-name" class="editor-input" type="text" readonly />
            </label>
            <label class="editor-field">
              <span id="editor-id-label"></span>
              <input id="editor-id" class="editor-input" type="text" readonly />
            </label>
            <label class="editor-field">
              <span id="editor-world-label"></span>
              <input id="editor-world" class="editor-input" type="text" readonly />
            </label>
            <label class="editor-check-field">
              <input id="editor-disabled" type="checkbox" />
              <span id="editor-disabled-label"></span>
            </label>
          </div>
          <label class="editor-field">
            <span id="editor-description-label"></span>
            <textarea id="editor-description" class="editor-textarea editor-textarea-small" spellcheck="false"></textarea>
          </label>
          <label class="editor-field">
            <span id="editor-code-label"></span>
            <textarea id="editor-code" class="editor-textarea editor-code" spellcheck="false"></textarea>
          </label>
          <details class="editor-advanced">
            <summary id="editor-advanced-label"></summary>
            <label class="editor-field">
              <span id="editor-help-template-label"></span>
              <textarea id="editor-help-template" class="editor-textarea editor-textarea-small" spellcheck="false"></textarea>
            </label>
            <label class="editor-field">
              <span id="editor-help-strings-label"></span>
              <textarea id="editor-help-strings" class="editor-textarea editor-textarea-small" spellcheck="false"></textarea>
            </label>
            <label class="editor-field">
              <span id="editor-options-label"></span>
              <textarea id="editor-options" class="editor-textarea editor-textarea-small" spellcheck="false"></textarea>
            </label>
            <label class="editor-field">
              <span id="editor-requires-label"></span>
              <textarea id="editor-requires" class="editor-textarea editor-textarea-small" spellcheck="false"></textarea>
            </label>
          </details>
          <div class="editor-actions">
            <wa-button variant="brand" type="submit" id="editor-save-button"></wa-button>
            <wa-button variant="neutral" type="button" id="editor-reset-button"></wa-button>
          </div>
          <div class="bundle-status" id="editor-status" hidden></div>
        </form>
      </section>
    </main>
    <script src="manager.js"></script>
  </body>
</html>
